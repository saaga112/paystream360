bundle:
  name: paystream360

targets:
  dev:
    default: true
  prod: {}

resources:
  jobs:
    paystream-job:
      name: PayStream Settlement Pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/src/etl/01_bronze_ingest.py
          job_cluster_key: small
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: /Workspace/src/etl/02_silver_enrich.py
          job_cluster_key: medium
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: /Workspace/src/etl/03_gold_settlement.py
          job_cluster_key: medium
      job_clusters:
        - job_cluster_key: small
          new_cluster:
            spark_version: 14.3.x-scala2.12
            num_workers: 1
        - job_cluster_key: medium
          new_cluster:
            spark_version: 14.3.x-scala2.12
            num_workers: 3
